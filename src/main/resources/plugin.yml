name: SpaMedal
version: '${project.version}'
main: dev.spa.spamedal.SpaMedalPlugin
api-version: "1.21"
author: spa
description: スパコインと交換できる物理通貨「スパメダル」と両替所
depend: [Vault]

commands:
  medal:
    description: スパメダルの発行状況と設定の再読み込み
    usage: /medal <stats|reload>
  medalnpc:
    description: 両替所の村人を置く・取り除く
    usage: /medalnpc <here|remove|status>

permissions:
  spamedal.admin:
    description: 発行状況の確認、設定の再読み込み、両替所の設置
    default: op
